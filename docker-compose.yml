services:

  postgres:
    image: postgres:18
    container_name: servicewatch-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql


  backend:
    build: .
    container_name: servicewatch-backend
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/serviceWatch
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}

    ports:
      - "8081:8081"


  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile

    container_name: payment-service
    restart: unless-stopped

    ports:
      - "8082:8082"


volumes:
  postgres_data: